services:
  db:
    container_name: db
    image: "mongo:${MONGODB_VERSION}"
    command: "mongod --bind_ip 0.0.0.0 --port 27017"
    networks:
      open5gs:
        aliases:
          - db.open5gs.org
    volumes:
      - db_data:/data/db
      - db_config:/data/configdb
    ports:
      - "0.0.0.0:27017:27017/tcp"

  nrf:
    container_name: nrf
    image: "ghcr.io/borjis131/nrf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/nrf.yaml"
    networks:
      open5gs:
        aliases:
          - nrf.open5gs.org
    configs:
      - source: nrf_config
        target: /etc/open5gs/custom/nrf.yaml

  ausf:
    container_name: ausf
    image: "ghcr.io/borjis131/ausf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/ausf.yaml"
    networks:
      open5gs:
        aliases:
          - ausf.open5gs.org
    configs:
      - source: ausf_config
        target: /etc/open5gs/custom/ausf.yaml
    depends_on:
      - nrf

  udm:
    container_name: udm
    image: "ghcr.io/borjis131/udm:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/udm.yaml"
    networks:
      open5gs:
        aliases:
          - udm.open5gs.org
    configs:
      - source: udm_config
        target: /etc/open5gs/custom/udm.yaml
    depends_on:
      - nrf

  udr:
    container_name: udr
    image: "ghcr.io/borjis131/udr:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/udr.yaml"
    restart: unless-stopped
    networks:
      open5gs:
        aliases:
          - udr.open5gs.org
    configs:
      - source: udr_config
        target: /etc/open5gs/custom/udr.yaml
    depends_on:
      - db
      - nrf

  nssf:
    container_name: nssf
    image: "ghcr.io/borjis131/nssf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/nssf.yaml"
    networks:
      open5gs:
        aliases:
          - nssf.open5gs.org
    configs:
      - source: nssf_config
        target: /etc/open5gs/custom/nssf.yaml
    depends_on:
      - nrf

  bsf:
    container_name: bsf
    image: "ghcr.io/borjis131/bsf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/bsf.yaml"
    networks:
      open5gs:
        aliases:
          - bsf.open5gs.org
    configs:
      - source: bsf_config
        target: /etc/open5gs/custom/bsf.yaml
    depends_on:
      - nrf

  pcf:
    container_name: pcf
    image: "ghcr.io/borjis131/pcf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/pcf.yaml"
    restart: unless-stopped
    networks:
      open5gs:
        aliases:
          - pcf.open5gs.org
    configs:
      - source: pcf_config
        target: /etc/open5gs/custom/pcf.yaml
    depends_on:
      - db
      - nrf

  amf:
    container_name: amf
    image: "ghcr.io/borjis131/amf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/amf.yaml"
    networks:
      open5gs:
        aliases:
          - amf.open5gs.org
    configs:
      - source: amf_config
        target: /etc/open5gs/custom/amf.yaml
    depends_on:
      - nrf

  # smfN/upfN: número de fatias é dinâmico (fair5gctl up --slices N), então esses
  # serviços vêm de compose-files/network-slicing/docker-compose.slices.generated.yaml
  # (gerado por scripts/render_slice_configs.py e mesclado via -f no scripts/up_v0.sh).

  gnb:
    container_name: gnb
    image: "ghcr.io/borjis131/gnb:v3.2.7"
    command: "-c /UERANSIM/config/gnb.yaml"
    # Dual-homed: perna no core (NGAP/GTP-U) + perna na rede de acesso (link de rádio
    # simulado com os UEs). É a fronteira entre acesso e transporte, como um gNB real.
    #
    # A travessia é feita em nível de APLICAÇÃO (termina RLS de um lado, origina
    # NGAP/GTP-U do outro). Com `ip_forward=0` o kernel não roteia entre as duas pernas,
    # então o container não pode ser usado como roteador de pivô do acesso para o core —
    # isso vira propriedade estrutural, não algo que depende do whitelist do OVS estar certo.
    sysctls:
      net.ipv4.ip_forward: 0
    networks:
      open5gs:
        aliases:
          - gnb.ueransim.org
      fair5g-access:
        aliases:
          - gnb.access
    configs:
      - source: gnb_config
        target: /UERANSIM/config/gnb.yaml
    depends_on:
      - amf
      - pcf
      - udr

  prometheus:
    container_name: prometheus
    image: "prom/prometheus:v2.51.0"
    networks:
      open5gs:
        aliases:
          - metrics.prometheus.org
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "0.0.0.0:9090:9090/tcp"
    depends_on:
      - amf
      - pcf

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    ports:
      - "9115:9115"
    # Exceção de observabilidade: o job `blackbox-ping-slices` sonda os IPs dos UEs, que
    # ficam na rede de acesso. Sem essa perna o probe morre e os painéis de latência por
    # fatia ficam vazios. Só ORIGINA probes — `ip_forward=0` garante que não pode ser
    # usado como roteador de pivô do acesso para o core.
    sysctls:
      net.ipv4.ip_forward: 0
    networks:
      open5gs:
        aliases:
          - blackbox.open5gs.org
      fair5g-access:
        aliases:
          - blackbox.access
    restart: always
    cap_add:
      - NET_RAW
    configs:
      - source: blackbox_config
        target: /etc/blackbox/blackbox.yml
    command: --config.file=/etc/blackbox/blackbox.yml

  grafana:
    container_name: grafana
    image: "grafana/grafana-oss:10.4.0"
    networks:
      open5gs:
        aliases:
          - dashboard.grafana.org
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/open5gs_prometheus.yaml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/open5gs_metrics.yaml
    volumes:
      - ../../configs/network-slicing/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    ports:
      - "0.0.0.0:3000:3000/tcp"
    depends_on:
      - prometheus

  webui:
    container_name: webui
    image: "webui:${OPEN5GS_VERSION}"
    build:
      context: ../../images/webui
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
        - NODE_VERSION=${NODE_VERSION}
    environment:
      - DB_URI=mongodb://db.open5gs.org/open5gs
      - PORT=9999
      - HOSTNAME=0.0.0.0
      - NODE_ENV=dev
    command: "run dev"
    networks:
      open5gs:
        aliases:
          - webui.open5gs.org
    depends_on:
      - db
    ports:
      - "0.0.0.0:9999:9999/tcp"


networks:
  # Rede de transporte do core (N2/N3/SBI). Nenhum UE tem presença aqui.
  open5gs:
    name: open5gs
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ogs
    ipam:
      config:
        - subnet: 10.33.33.0/24

  # Rede de acesso: só os UEs (via switch OVS) e a perna de rádio do gNB. O gNB é a
  # única ponte entre as duas redes, e faz isso em nível de aplicação (termina o RLS de
  # um lado, origina NGAP/GTP-U do outro) — não roteia pacotes entre as pernas. Assim
  # o core fica inalcançável para um UE por topologia, não por regra de firewall.
  fair5g-access:
    name: fair5g-access
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-access
    ipam:
      config:
        - subnet: 10.34.0.0/24

volumes:
  db_data:
    name: open5gs_db_data
  db_config:
    name: open5gs_db_config
  prometheus_data:
    name: open5gs_prometheus_data

configs:
  nrf_config:
    file: ../../configs/network-slicing/nrf.yaml
  ausf_config:
    file: ../../configs/network-slicing/ausf.yaml
  udm_config:
    file: ../../configs/network-slicing/udm.yaml
  udr_config:
    file: ../../configs/network-slicing/udr.yaml
  bsf_config:
    file: ../../configs/network-slicing/bsf.yaml
  pcf_config:
    file: ../../configs/network-slicing/pcf.yaml
  # amf/nssf/gnb/prometheus dependem da quantidade de fatias (N) e são gerados em
  # configs/runtime/ por scripts/render_slice_configs.py antes do `docker compose up`.
  amf_config:
    file: ../../configs/runtime/amf.yaml
  nssf_config:
    file: ../../configs/runtime/nssf.yaml
  gnb_config:
    file: ../../configs/runtime/gnb.yaml
  prometheus_config:
    file: ../../configs/runtime/prometheus.yml
  grafana_datasource:
    file: ../../configs/network-slicing/grafana/datasource.yaml
  grafana_dashboard_provider:
    file: ../../configs/network-slicing/grafana/dashboard_provider.yaml
  blackbox_config:
    file: ../../configs/network-slicing/blackbox.yml
