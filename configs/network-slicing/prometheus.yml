global:
  scrape_interval: 10s

scrape_configs:
  - job_name: amf
    static_configs:
      - targets: ["amf.open5gs.org:9090"]
  - job_name: pcf
    static_configs:
      - targets: ["pcf.open5gs.org:9090"]
  - job_name: smf
    static_configs:
      - targets: ["smf1.open5gs.org:9090", "smf2.open5gs.org:9090"]
  - job_name: upf
    static_configs:
      - targets: ["upf1.open5gs.org:9090", "upf2.open5gs.org:9090"]
  - job_name: 'blackbox-ping-slices'
    metrics_path: /probe
    params:
      module: [icmp] 
    static_configs:
      - targets:
        - 10.33.33.200   
        - 10.33.33.201
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115 
